document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

/eyebrow text */\n  --red-link: #AC1934;       /* links (hover: ink) */\n  --purple-meta: #3E2C5C;    /* secondary/meta text */\n  --page: #EDE9DF;           /* page background behind cards */\n\n  /* Semantic aliases */\n  --surface-page: var(--page);\n  --surface-card: var(--cream);\n  --text-body: var(--ink);\n  --text-title: var(--blue);\n  --text-script: var(--red-script);\n  --text-kicker: var(--crimson-kicker);\n  --text-meta: var(--purple-meta);\n  --text-link: var(--red-link);\n  --text-link-hover: var(--ink);\n  --border-ink: var(--ink);\n  --rule-red: var(--red-rule);\n}\n\n/* New Americana — type tokens */\n:root {\n  --font-display: 'Archivo Black', 'Arial Black', sans-serif;\n  --font-script: 'Pacifico', cursive;\n  --font-body: 'Cabin', 'Trebuchet MS', sans-serif;\n  --font-label: 'Bebas Neue', 'Oswald', sans-serif;\n\n  /* Display title (banner) */\n  --title-size: 40px;\n  --title-tracking: .02em;\n  --title-leading: 1.15;\n\n  /* Script accent line */\n  --script-size: 38px;\n  --script-leading: 1.35;\n  --script-tuck-top: -2px;   /* negative top margin */\n  --script-tuck-left: 10px;  /* left indent under the title */\n\n  /* Body */\n  --body-size: 17px;\n  --body-leading: 1.7;\n\n  /* Kicker */\n  --kicker-size: 16px;\n  --kicker-tracking: .22em;\n\n  /* Section-scale title (headers inside a page) */\n  --title-sm-size: 26px;\n}\n\n/* New Americana — spacing tokens */\n:root {\n  --banner-pad: 26px 30px 20px 30px; /* signature banner padding, exact */\n  --rule-gap: 12px;                  /* top margin above the 4px rule */\n  --card-pad: 22px 24px;\n  --stack-gap: 28px;                 /* between blocks on a page */\n  --page-pad: 32px;\n  --measure: 66ch;\n}\n\n/* New Americana — borders & rules. Square corners everywhere. */\n:root {\n  --border-standard: 2px solid var(--ink);\n  --rule-standard: 4px solid var(--red-rule);\n  --radius: 0; /* no border-radius anywhere */\n}\n\n/* New Americana — minimal base */\nbody { margin: 0; background: var(--page); color: var(--ink);\n  font-family: var(--font-body); font-size: var(--body-size); line-height: var(--body-leading); }\na { color: var(--red-link); text-decoration: underline; }\na:hover { color: var(--ink); }\n\n<\u002Fstyle>\n  <script src=\"cf5ebcb6-d068-447d-8872-1f4a862655ad\"><\u002Fscript>\n  <script src=\"9b49371e-fc00-4cd4-ae29-b40e6c590281\"><\u002Fscript>\n  <script src=\"d3cb9660-1566-4981-9233-7758db08fcc8\"><\u002Fscript>\n  <style>\n    body{margin:0;background:#EDE9DF;}\n    a{color:#AC1934;} a:hover{color:#1B0F2E;}\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<main style=\"font-family:Cabin,sans-serif;color:#1B0F2E;font-size:17px;line-height:1.6;max-width:1120px;margin:0 auto;padding:28px 20px 48px;display:flex;flex-direction:column;gap:28px;\">\n\n  <header style=\"background:#F8F4EB;border:2px solid #1B0F2E;padding:26px 30px 20px;\">\n    <div style=\"font-weight:700;font-size:16px;letter-spacing:.12em;color:#8E1229;\">GOVT 2305 · GOVT 2306 · General Election 2026<\u002Fdiv>\n    <h1 style=\"margin:6px 0 0;font-family:'Archivo Black',sans-serif;font-weight:400;font-size:40px;line-height:1.15;color:#2F5A9E;\">North Texas Voter Guide<\u002Fh1>\n    <div style=\"font-family:Pacifico,cursive;font-size:30px;line-height:1.35;color:#C21F3D;margin:-2px 0 0 10px;\">know your ballot<\u002Fdiv>\n    <div role=\"presentation\" style=\"border-top:4px solid #DB2547;margin-top:12px;\"><\u002Fdiv>\n  <\u002Fheader>\n\n  <section style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:20px;\">\n    <div style=\"background:#F8F4EB;border:2px solid #1B0F2E;padding:18px 22px;\">\n      <h2 style=\"margin:0 0 6px;font-family:'Archivo Black',sans-serif;font-weight:400;font-size:22px;color:#2F5A9E;\">Key Dates<\u002Fh2>\n      <ul style=\"margin:0;padding-left:20px;\">\n        <li>Early voting: <strong>Monday, Oct. 19 – Friday, Oct. 30<\u002Fstrong><\u002Fli>\n        <li>Election Day: <strong>Tuesday, Nov. 3<\u002Fstrong>, 7 a.m. – 7 p.m.<\u002Fli>\n        <li>Registration deadline passed <strong>Oct. 5<\u002Fstrong>. Check your status at <a href=\"https://www.votetexas.gov/\" target=\"_blank\" rel=\"noopener\">VoteTexas.gov<\u002Fa>.<\u002Fli>\n        <li>Bring an approved photo ID.<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div style=\"background:#F8F4EB;border:2px solid #1B0F2E;padding:18px 22px;\">\n      <h2 style=\"margin:0 0 6px;font-family:'Archivo Black',sans-serif;font-weight:400;font-size:22px;color:#2F5A9E;\">How to Use This Guide<\u002Fh2>\n      <ul style=\"margin:0;padding-left:20px;\">\n        <li>This guide is nonpartisan. It endorses no one.<\u002Fli>\n        <li>Democrats and Republicans get full profiles. Other parties are listed so you can look them up.<\u002Fli>\n        <li>Every claim names its source, drawn from news outlets, fact-checkers and official records.<\u002Fli>\n        <li>Use the Learn More keywords to research an issue on Google or with AI.<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <p style=\"margin:0;max-width:72ch;text-wrap:pretty;\">Covers Dallas, Tarrant, Collin, Denton, Ellis, Kaufman, Rockwall, Johnson, Parker, Wise, Hunt and Grayson counties. Your exact races depend on your address. Find your sample ballot on your county elections website or the <a href=\"https://apps.texastribune.org/features/2026/texas-general-election-ballot-november-2026/\" target=\"_blank\" rel=\"noopener\">Texas Tribune ballot tool<\u002Fa>. Current as of <strong>Oct. 18, 2026<\u002Fstrong>.<\u002Fp>\n\n  <div style=\"background:#F8F4EB;border:2px solid #1B0F2E;padding:16px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;position:sticky;top:0;z-index:5;\">\n    <label for=\"vg-search\" style=\"font-weight:700;color:#8E1229;\">Search<\u002Flabel>\n    <input id=\"vg-search\" type=\"search\" value=\"{{ query }}\" sc-camel-on-change=\"{{ onQuery }}\" placeholder=\"Candidate, office or keyword (e.g. dark money)\" style=\"flex:1 1 260px;min-width:0;font:inherit;padding:8px 12px;border:2px solid #1B0F2E;background:#FFFFFF;color:#1B0F2E;border-radius:0;\">\n    <div role=\"group\" aria-label=\"Filter races\" style=\"display:flex;gap:8px;flex-wrap:wrap;\">\n      <sc-for list=\"{{ filters }}\" as=\"f\" hint-placeholder-count=\"3\">\n        <button type=\"button\" sc-camel-on-click=\"{{ f.onClick }}\" aria-pressed=\"{{ f.pressed }}\" style=\"font:inherit;font-weight:700;padding:7px 14px;border:2px solid #1B0F2E;border-radius:0;cursor:pointer;background:{{ f.bg }};color:{{ f.fg }};\">{{ f.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <span style=\"color:#3E2C5C;font-size:15px;\">{{ countLabel }}<\u002Fspan>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ noResults }}\" hint-placeholder-val=\"{{ false }}\">\n    <p style=\"margin:0;\">No races match that search. Try a candidate’s last name or a keyword from the bank below.<\u002Fp>\n  <\u002Fsc-if>\n\n  <sc-for list=\"{{ races }}\" as=\"race\" hint-placeholder-count=\"2\">\n    <section id=\"{{ race.id }}\" data-screen-label=\"{{ race.title }}\" style=\"display:flex;flex-direction:column;gap:16px;\">\n      <div style=\"background:#F8F4EB;border:2px solid #1B0F2E;padding:20px 26px 16px;\">\n        <div style=\"font-weight:700;font-size:15px;letter-spacing:.12em;color:#8E1229;\">{{ race.group }} · {{ race.term }}<\u002Fdiv>\n        <h2 style=\"margin:4px 0 0;font-family:'Archivo Black',sans-serif;font-weight:400;font-size:28px;line-height:1.2;color:#2F5A9E;\">{{ race.title }}<\u002Fh2>\n        <p style=\"margin:6px 0 0;max-width:80ch;text-wrap:pretty;\">{{ race.what }}<\u002Fp>\n        <div role=\"presentation\" style=\"border-top:4px solid #DB2547;margin-top:12px;\"><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px;\">\n        <sc-for list=\"{{ race.candidates }}\" as=\"c\" hint-placeholder-count=\"2\">\n          <article style=\"background:#FFFFFF;border:2px solid #1B0F2E;padding:18px 20px;display:flex;flex-direction:column;gap:10px;\">\n            <div style=\"display:flex;gap:16px;align-items:flex-start;\">\n              <image-slot id=\"{{ c.slotId }}\" shape=\"rect\" placeholder=\"Candidate photo\" style=\"width:104px;height:130px;flex:none;border:2px solid #1B0F2E;\"><\u002Fimage-slot>\n              <div style=\"display:flex;flex-direction:column;gap:2px;min-width:0;\">\n                <span style=\"font-weight:700;font-size:15px;letter-spacing:.08em;color:{{ c.partyColor }};\">{{ c.party }}<\u002Fspan>\n                <h3 style=\"margin:0;font-family:'Archivo Black',sans-serif;font-weight:400;font-size:22px;line-height:1.2;color:#1B0F2E;\">{{ c.name }}<\u002Fh3>\n                <span style=\"color:#3E2C5C;font-size:15px;\">{{ c.role }}<\u002Fspan>\n                <a href=\"{{ c.site }}\" target=\"_blank\" rel=\"noopener\" style=\"font-size:15px;\">Campaign Website<\u002Fa>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <p style=\"margin:0;text-wrap:pretty;\">{{ c.bio }}<\u002Fp>\n            <div>\n              <h4 style=\"margin:0 0 2px;font-size:16px;color:#8E1229;\">Big Achievements<\u002Fh4>\n              <ul style=\"margin:0;padding-left:20px;\">\n                <sc-for list=\"{{ c.achievements }}\" as=\"a\" hint-placeholder-count=\"2\"><li>{{ a }}<\u002Fli><\u002Fsc-for>\n              <\u002Ful>\n            <\u002Fdiv>\n            <div>\n              <h4 style=\"margin:0 0 2px;font-size:16px;color:#8E1229;\">Controversies and Criticism<\u002Fh4>\n              <ul style=\"margin:0;padding-left:20px;\">\n                <sc-for list=\"{{ c.controversies }}\" as=\"x\" hint-placeholder-count=\"2\"><li>{{ x }}<\u002Fli><\u002Fsc-for>\n              <\u002Ful>\n            <\u002Fdiv>\n          <\u002Farticle>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ race.hasMoney }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background:#F8F4EB;border:2px solid #1B0F2E;padding:12px 18px;\"><strong style=\"color:#8E1229;\">Follow the Money:<\u002Fstrong> {{ race.money }}<\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ race.hasChecks }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background:#FFFFFF;border:2px solid #1B0F2E;padding:14px 18px;overflow-x:auto;\">\n          <h3 style=\"margin:0 0 8px;font-family:'Archivo Black',sans-serif;font-weight:400;font-size:20px;color:#2F5A9E;\">Fact Check: Campaign Claims<\u002Fh3>\n          <sc-raw-table style=\"width:100%;min-width:620px;table-layout:fixed;border-collapse:collapse;font-size:15px;line-height:1.45;\">\n            <sc-raw-thead>\n              <sc-raw-tr>\n                <sc-raw-th scope=\"col\" style=\"width:31%;text-align:left;vertical-align:top;padding:8px 10px;border:1.5px solid #1B0F2E;background:#F8F4EB;color:#8E1229;\">Claim<\u002Fsc-raw-th>\n                <sc-raw-th scope=\"col\" style=\"width:14%;text-align:left;vertical-align:top;padding:8px 10px;border:1.5px solid #1B0F2E;background:#F8F4EB;color:#8E1229;\">Verdict<\u002Fsc-raw-th>\n                <sc-raw-th scope=\"col\" style=\"width:37%;text-align:left;vertical-align:top;padding:8px 10px;border:1.5px solid #1B0F2E;background:#F8F4EB;color:#8E1229;\">What the Record Shows<\u002Fsc-raw-th>\n                <sc-raw-th scope=\"col\" style=\"width:18%;text-align:left;vertical-align:top;padding:8px 10px;border:1.5px solid #1B0F2E;background:#F8F4EB;color:#8E1229;\">Source<\u002Fsc-raw-th>\n              <\u002Fsc-raw-tr>\n            <\u002Fsc-raw-thead>\n            <sc-raw-tbody>\n              <sc-for list=\"{{ race.checks }}\" as=\"k\" hint-placeholder-count=\"2\">\n                <sc-raw-tr>\n                  <sc-raw-td style=\"vertical-align:top;padding:8px 10px;border:1.5px solid #1B0F2E;overflow-wrap:anywhere;\">{{ k.claim }}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"vertical-align:top;padding:8px 10px;border:1.5px solid #1B0F2E;font-weight:700;\">{{ k.verdict }}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"vertical-align:top;padding:8px 10px;border:1.5px solid #1B0F2E;overflow-wrap:anywhere;\">{{ k.truth }}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"vertical-align:top;padding:8px 10px;border:1.5px solid #1B0F2E;overflow-wrap:anywhere;color:#3E2C5C;\">{{ k.source }}<\u002Fsc-raw-td>\n                <\u002Fsc-raw-tr>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-tbody>\n          <\u002Fsc-raw-table>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px;\">\n        <div style=\"background:#F8F4EB;border:2px solid #1B0F2E;padding:12px 18px;\">\n          <h3 style=\"margin:0 0 4px;font-size:17px;color:#8E1229;\">Learn More: Research Keywords<\u002Fh3>\n          <ul style=\"margin:0;padding-left:20px;\">\n            <sc-for list=\"{{ race.kw }}\" as=\"w\" hint-placeholder-count=\"3\"><li><a href=\"{{ w.href }}\" target=\"_blank\" rel=\"noopener\">{{ w.label }}<\u002Fa><\u002Fli><\u002Fsc-for>\n            <li><a href=\"{{ race.aiHref }}\" target=\"_blank\" rel=\"noopener\">Ask an AI to compare these candidates<\u002Fa> (check what it says against the sources)<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <sc-if value=\"{{ race.hasOthers }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"background:#F8F4EB;border:2px solid #1B0F2E;padding:12px 18px;\">\n            <h3 style=\"margin:0 0 4px;font-size:17px;color:#8E1229;\">Other Candidates on the Ballot<\u002Fh3>\n            <ul style=\"margin:0;padding-left:20px;\">\n              <sc-for list=\"{{ race.others }}\" as=\"o\" hint-placeholder-count=\"1\"><li>{{ o }}<\u002Fli><\u002Fsc-for>\n            <\u002Ful>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-for>\n\n  <section id=\"tx-house\" style=\"background:#FFFFFF;border:2px solid #1B0F2E;padding:20px 26px;overflow-x:auto;\">\n    <h2 style=\"margin:0 0 4px;font-family:'Archivo Black',sans-serif;font-weight:400;font-size:26px;color:#2F5A9E;\">Texas House: DFW Districts<\u002Fh2>\n    <p style=\"margin:0 0 10px;max-width:80ch;text-wrap:pretty;\">All 150 seats are up. Republicans hold 88. Ratings are from State Navigate (Oct. 8, 2026); target seats are from the Democratic Legislative Campaign Committee (via Wikipedia). Candidate lists are from Ballotpedia. Check your sample ballot to confirm your district.<\u002Fp>\n    <sc-raw-table style=\"width:100%;min-width:760px;table-layout:fixed;border-collapse:collapse;font-size:15px;line-height:1.45;\">\n      <sc-raw-thead>\n        <sc-raw-tr>\n          <sc-raw-th scope=\"col\" style=\"width:8%;text-align:left;vertical-align:top;padding:8px 10px;border:1.5px solid #1B0F2E;background:#F8F4EB;color:#8E1229;\">District<\u002Fsc-raw-th>\n          <sc-raw-th scope=\"col\" style=\"width:20%;text-align:left;vertical-align:top;padding:8px 10px;border:1.5px solid #1B0F2E;background:#F8F4EB;color:#8E1229;\">Area<\u002Fsc-raw-th>\n          <sc-raw-th scope=\"col\" style=\"width:16%;text-align:left;vertical-align:top;padding:8px 10px;border:1.5px solid #1B0F2E;background:#F8F4EB;color:#8E1229;\">Democrat<\u002Fsc-raw-th>\n          <sc-raw-th scope=\"col\" style=\"width:16%;text-align:left;vertical-align:top;padding:8px 10px;border:1.5px solid #1B0F2E;background:#F8F4EB;color:#8E1229;\">Republican<\u002Fsc-raw-th>\n          <sc-raw-th scope=\"col\" style=\"width:12%;text-align:left;vertical-align:top;padding:8px 10px;border:1.5px solid #1B0F2E;background:#F8F4EB;color:#8E1229;\">Other<\u002Fsc-raw-th>\n          <sc-raw-th scope=\"col\" style=\"width:28%;text-align:left;vertical-align:top;padding:8px 10px;border:1.5px solid #1B0F2E;background:#F8F4EB;color:#8E1229;\">What to Know<\u002Fsc-raw-th>\n        <\u002Fsc-raw-tr>\n      <\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-for list=\"{{ legislature }}\" as=\"r\" hint-placeholder-count=\"4\">\n          <sc-raw-tr>\n            <sc-raw-th scope=\"row\" style=\"vertical-align:top;padding:8px 10px;border:1.5px solid #1B0F2E;overflow-wrap:anywhere;text-align:left;\">{{ r.d }}<\u002Fsc-raw-th>\n            <sc-raw-td style=\"vertical-align:top;padding:8px 10px;border:1.5px solid #1B0F2E;overflow-wrap:anywhere;\">{{ r.area }}<\u002Fsc-raw-td>\n            <sc-raw-td style=\"vertical-align:top;padding:8px 10px;border:1.5px solid #1B0F2E;overflow-wrap:anywhere;\">{{ r.dem }}<\u002Fsc-raw-td>\n            <sc-raw-td style=\"vertical-align:top;padding:8px 10px;border:1.5px solid #1B0F2E;overflow-wrap:anywhere;\">{{ r.rep }}<\u002Fsc-raw-td>\n            <sc-raw-td style=\"vertical-align:top;padding:8px 10px;border:1.5px solid #1B0F2E;overflow-wrap:anywhere;\">{{ r.oth }}<\u002Fsc-raw-td>\n            <sc-raw-td style=\"vertical-align:top;padding:8px 10px;border:1.5px solid #1B0F2E;overflow-wrap:anywhere;\">{{ r.note }}<\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n        <\u002Fsc-for>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n  <\u002Fsection>\n\n  <section id=\"propositions\" style=\"background:#FFFFFF;border:2px solid #1B0F2E;padding:20px 26px;overflow-x:auto;\">\n    <h2 style=\"margin:0 0 4px;font-family:'Archivo Black',sans-serif;font-weight:400;font-size:26px;color:#2F5A9E;\">Local Propositions<\u002Fh2>\n    <p style=\"margin:0 0 10px;max-width:80ch;text-wrap:pretty;\">These local measures appear only if you live in that city, county or district. Not a complete list.<\u002Fp>\n    <sc-raw-table style=\"width:100%;min-width:760px;table-layout:fixed;border-collapse:collapse;font-size:15px;line-height:1.45;\">\n      <sc-raw-thead>\n        <sc-raw-tr>\n          <sc-raw-th scope=\"col\" style=\"width:14%;text-align:left;vertical-align:top;padding:8px 10px;border:1.5px solid #1B0F2E;background:#F8F4EB;color:#8E1229;\">Where<\u002Fsc-raw-th>\n          <sc-raw-th scope=\"col\" style=\"width:20%;text-align:left;vertical-align:top;padding:8px 10px;border:1.5px solid #1B0F2E;background:#F8F4EB;color:#8E1229;\">Measure<\u002Fsc-raw-th>\n          <sc-raw-th scope=\"col\" style=\"width:34%;text-align:left;vertical-align:top;padding:8px 10px;border:1.5px solid #1B0F2E;background:#F8F4EB;color:#8E1229;\">What It Does<\u002Fsc-raw-th>\n          <sc-raw-th scope=\"col\" style=\"width:20%;text-align:left;vertical-align:top;padding:8px 10px;border:1.5px solid #1B0F2E;background:#F8F4EB;color:#8E1229;\">Arguments<\u002Fsc-raw-th>\n          <sc-raw-th scope=\"col\" style=\"width:12%;text-align:left;vertical-align:top;padding:8px 10px;border:1.5px solid #1B0F2E;background:#F8F4EB;color:#8E1229;\">Source<\u002Fsc-raw-th>\n        <\u002Fsc-raw-tr>\n      <\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-for list=\"{{ propositions }}\" as=\"p\" hint-placeholder-count=\"3\">\n          <sc-raw-tr>\n            <sc-raw-th scope=\"row\" style=\"vertical-align:top;padding:8px 10px;border:1.5px solid #1B0F2E;overflow-wrap:anywhere;text-align:left;\">{{ p.place }}<\u002Fsc-raw-th>\n            <sc-raw-td style=\"vertical-align:top;padding:8px 10px;border:1.5px solid #1B0F2E;overflow-wrap:anywhere;\">{{ p.name }}<\u002Fsc-raw-td>\n            <sc-raw-td style=\"vertical-align:top;padding:8px 10px;border:1.5px solid #1B0F2E;overflow-wrap:anywhere;\">{{ p.what }}<\u002Fsc-raw-td>\n            <sc-raw-td style=\"vertical-align:top;padding:8px 10px;border:1.5px solid #1B0F2E;overflow-wrap:anywhere;\">{{ p.sides }}<\u002Fsc-raw-td>\n            <sc-raw-td style=\"vertical-align:top;padding:8px 10px;border:1.5px solid #1B0F2E;overflow-wrap:anywhere;color:#3E2C5C;\">{{ p.source }}<\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n        <\u002Fsc-for>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n  <\u002Fsection>\n\n  <section style=\"background:#F8F4EB;border:2px solid #1B0F2E;padding:20px 26px;\">\n    <h2 style=\"margin:0 0 6px;font-family:'Archivo Black',sans-serif;font-weight:400;font-size:26px;color:#2F5A9E;\">Also on Your Ballot<\u002Fh2>\n    <ul style=\"margin:0;padding-left:20px;\">\n      <li>Fifth District Court of Appeals seats (covers Collin, Dallas, Grayson, Hunt, Kaufman and Rockwall counties) and Second Court of Appeals seats (Tarrant area)<\u002Fli>\n      <li>State Board of Education<\u002Fli>\n      <li>District courts, county courts at law, justices of the peace and constables<\u002Fli>\n      <li>County commissioners, clerks and DAs in Denton, Ellis, Kaufman, Rockwall, Johnson, Parker, Wise, Hunt and Grayson counties<\u002Fli>\n    <\u002Ful>\n    <p style=\"margin:8px 0 0;\">Find these on your county elections website or at <a href=\"https://ballotpedia.org/Sample_Ballot_Lookup\" target=\"_blank\" rel=\"noopener\">Ballotpedia’s sample ballot lookup<\u002Fa>.<\u002Fp>\n  <\u002Fsection>\n\n  <section style=\"background:#FFFFFF;border:2px solid #1B0F2E;padding:20px 26px;overflow-x:auto;\">\n    <h2 style=\"margin:0 0 4px;font-family:'Archivo Black',sans-serif;font-weight:400;font-size:26px;color:#2F5A9E;\">Research Keyword Bank<\u002Fh2>\n    <p style=\"margin:0 0 10px;\">Each keyword links to a Google search. Paste the same words into an AI tool, then confirm what it tells you with a news source or government site.<\u002Fp>\n    <sc-raw-table style=\"width:100%;min-width:640px;table-layout:fixed;border-collapse:collapse;font-size:15px;line-height:1.45;\">\n      <sc-raw-thead>\n        <sc-raw-tr>\n          <sc-raw-th scope=\"col\" style=\"width:22%;text-align:left;vertical-align:top;padding:8px 10px;border:1.5px solid #1B0F2E;background:#F8F4EB;color:#8E1229;\">Topic<\u002Fsc-raw-th>\n          <sc-raw-th scope=\"col\" style=\"width:26%;text-align:left;vertical-align:top;padding:8px 10px;border:1.5px solid #1B0F2E;background:#F8F4EB;color:#8E1229;\">Course Connection<\u002Fsc-raw-th>\n          <sc-raw-th scope=\"col\" style=\"width:52%;text-align:left;vertical-align:top;padding:8px 10px;border:1.5px solid #1B0F2E;background:#F8F4EB;color:#8E1229;\">Search These Keywords<\u002Fsc-raw-th>\n        <\u002Fsc-raw-tr>\n      <\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-for list=\"{{ bank }}\" as=\"b\" hint-placeholder-count=\"4\">\n          <sc-raw-tr>\n            <sc-raw-th scope=\"row\" style=\"text-align:left;vertical-align:top;padding:8px 10px;border:1.5px solid #1B0F2E;\">{{ b.topic }}<\u002Fsc-raw-th>\n            <sc-raw-td style=\"vertical-align:top;padding:8px 10px;border:1.5px solid #1B0F2E;color:#3E2C5C;overflow-wrap:anywhere;\">{{ b.course }}<\u002Fsc-raw-td>\n            <sc-raw-td style=\"vertical-align:top;padding:8px 10px;border:1.5px solid #1B0F2E;\">\n              <ul style=\"margin:0;padding-left:18px;columns:2;column-gap:20px;\">\n                <sc-for list=\"{{ b.links }}\" as=\"l\" hint-placeholder-count=\"3\"><li><a href=\"{{ l.href }}\" target=\"_blank\" rel=\"noopener\">{{ l.label }}<\u002Fa><\u002Fli><\u002Fsc-for>\n              <\u002Ful>\n            <\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n        <\u002Fsc-for>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n  <\u002Fsection>\n\n  <footer style=\"font-size:14px;color:#3E2C5C;display:flex;flex-direction:column;gap:4px;\">\n    <p style=\"margin:0;\">Sources: Texas Tribune, The Green Papers (candidate lists and FEC totals), Ballotpedia, Wikipedia, KRIS, Community Impact, D Magazine, KWTX, FactCheck.org, Dallas Morning News, Dallas Observer, Houston Public Media, KXAN, NPR, TPR, The Texan, Fort Worth Report. FEC totals are campaign committee receipts through Sept. 30, 2026.<\u002Fp>\n    <p style=\"margin:0;\">© 2026 Cook Consulting Services LLC d/b/a Red Tape Academy. All rights reserved.<\u002Fp>\n  <\u002Ffooter>\n<\u002Fmain>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { query: '', group: 'All', races: [], bank: [], legislature: [], propositions: [] };\n  componentDidMount() {\n    const go = () => { const m = window.VG; if (m && m.races) this.setState({ races: m.races, bank: m.keywordBank, legislature: m.legislature, propositions: m.propositions }); else setTimeout(go, 50); }; go();\n  }\n  renderVals() {\n    const { query, group } = this.state;\n    const q = query.trim().toLowerCase();\n    const G = s => 'https://www.google.com/search?q=' + encodeURIComponent(s + ' explained');\n    const list = this.state.races.filter(r => {\n      if (group !== 'All' && r.group !== group) return false;\n      if (!q) return true;\n      return JSON.stringify(r).toLowerCase().includes(q);\n    }).map(r => ({\n      ...r,\n      hasChecks: r.checks.length > 0,\n      hasOthers: r.others.length > 0,\n      hasMoney: !!r.money,\n      kw: r.keywords.map(k => ({ label: k, href: G(k) })),\n      aiHref: 'https://chatgpt.com/?q=' + encodeURIComponent('In neutral, nonpartisan plain language, compare the 2026 Texas ' + r.title + ' candidates ' + r.candidates.map(c => c.name + ' (' + c.party + ')').join(' and ') + ' on their records, positions and any controversies. Cite news sources.'),\n      candidates: r.candidates.map(c => ({ ...c, site: c.site || ('https://www.google.com/search?q=' + encodeURIComponent(c.name + ' ' + r.title + ' 2026')), slotId: 'vg-' + r.id + '-' + c.name.toLowerCase().replace(/[^a-z]+/g, '-'), partyColor: c.party === 'Democrat' ? '#2F5A9E' : '#8E1229' }))\n    }));\n    const filters = ['All', 'Statewide', 'Courts', 'U.S. House', 'Texas Legislature', 'County'].map(label => ({\n      label, pressed: label === group ? 'true' : 'false',\n      bg: label === group ? '#1B0F2E' : '#FFFFFF', fg: label === group ? '#F8F4EB' : '#1B0F2E',\n      onClick: () => this.setState({ group: label })\n    }));\n    return {\n      query, filters, races: list, bank: this.state.bank,\n      legislature: this.state.legislature.filter(x => !q || JSON.stringify(x).toLowerCase().includes(q)),\n      propositions: this.state.propositions.filter(x => !q || JSON.stringify(x).toLowerCase().includes(q)),\n      noResults: this.state.races.length > 0 && list.length === 0,\n      countLabel: list.length + (list.length === 1 ? ' race' : ' races'),\n      onQuery: e => this.setState({ query: e.target.value })\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
